[package]
name = "damper-mock-feed"
description = "Admin-settable SEP-40 price feed for testnet demos and keeper tests. Not for production."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
