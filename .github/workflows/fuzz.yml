name: Deep fuzz

# A much deeper search than CI's per-push run: the property and stateful tests at far more
# cases (random sampling), and separately, coverage-guided fuzzing of the same pure math with
# cargo-fuzz (ADR 0006), which explores by code path instead. Runs weekly and on demand.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        default: '20000'
      stateful:
        description: Random operation sequences against the contract
        default: '250'
      fuzz_secs:
        description: Seconds per cargo-fuzz target
        default: '600'

jobs:
  proptest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Property and stateful fuzz tests
        env:
          PROPTEST_CASES: ${{ github.event.inputs.cases || '20000' }}
          DAMPER_FUZZ_STATEFUL_CASES: ${{ github.event.inputs.stateful || '250' }}
        run: cargo test fuzz
      - name: Keep any failing case
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: contracts/guarded-oracle/proptest-regressions/
          if-no-files-found: ignore

  cargo-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/guarded-oracle/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Coverage-guided fuzzing of the clamp, the gate and effective_policy
        working-directory: contracts/guarded-oracle
        run: |
          secs="${{ github.event.inputs.fuzz_secs || '600' }}"
          for target in clamp gate effective_policy; do
            cargo fuzz run "$target" -- -max_total_time="$secs"
          done
      - name: Keep any crashing case
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-artifacts
          path: contracts/guarded-oracle/fuzz/artifacts/
          if-no-files-found: ignore
